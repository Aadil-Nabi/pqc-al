worker_processes 1;
events { worker_connections 1024; }

http {
    default_type text/plain;

    server {
        listen 443 ssl;
        server_name legacy-web.lab;

        ssl_certificate     /etc/ssl/certs/legacy.crt;
        ssl_certificate_key /etc/ssl/private/legacy.key;

        # Deliberately bad: old protocols, CBC and 3DES, SHA-1 cert.
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers "ECDHE-RSA-AES256-SHA:AES128-SHA:DES-CBC3-SHA:AES256-GCM-SHA384@SECLEVEL=0";
        ssl_prefer_server_ciphers on;

        location / {
            return 200 "legacy-web.lab : TLS 1.0-1.2, RSA-2048, SHA-1 cert\n";
        }
    }
}

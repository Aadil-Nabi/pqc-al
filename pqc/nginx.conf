worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    default_type text/plain;
    access_log /var/log/nginx/access.log;

    server {
        listen 443 ssl;
        server_name pqc-web.lab;

        ssl_certificate     /etc/pki/tls/certs/pqc.crt;
        ssl_certificate_key /etc/pki/tls/private/pqc.key;

        # TLS 1.3 only. Hybrid ML-KEM first, classical X25519 as fallback.
        ssl_protocols TLSv1.3;
        ssl_ecdh_curve X25519MLKEM768:X25519;
        ssl_session_cache shared:SSL:5m;

        location / {
            return 200 "pqc-web.lab : TLS 1.3, X25519MLKEM768 offered\n";
        }
    }
}
